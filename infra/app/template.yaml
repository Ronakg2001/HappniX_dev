AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  HappniX app stack — dev environment. Free tier optimized: Cognito LITE tier
  (50K MAU free), Lambda 128MB. Flexible: Lambda functions toggled on/off via
  parameters.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ApplicationTag:
    Type: String
    Default: ""
    Description: ARN from AWS myApplications.

  FrontendUrl:
    Type: String
    Default: "https://happnix-dev-new.ronakgo1.workers.dev"
    Description: Frontend origin for CORS (cannot be '*' if using cookies).

  # ─── Network refs ───────────────────────────────────────────────────
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  # ─── Database config ───────────────────────────────────────────────
  AuthDbHost:
    Type: String
  AuthDbPort:
    Type: String
    Default: "5432"
  AuthDbName:
    Type: String
    Default: "happnix_in_dev"
  AuthDbUser:
    Type: String
  AuthDbPassword:
    Type: String
    NoEcho: true
  AuthDbConnectTimeout:
    Type: String
    Default: "5"

  # ─── Dev/Test controls ─────────────────────────────────────────────
  TestOtpMode:
    Type: String
    Default: "true"
    Description: When true, OTP is bypassed with fixed test OTP (123456).
  AllowFixedTestOtp:
    Type: String
    Default: "true"
    Description: When true, accepts 123456 as valid OTP in dev environment.

  # ─── Media storage ─────────────────────────────────────────────────
  R2BucketName:
    Type: String
    Default: ""
  R2Endpoint:
    Type: String
    Default: ""

  # ─── DynamoDB table names (from data stack) ────────────────────
  UsersTableName:
    Type: String
    Default: ""
    Description: DynamoDB users table name. Empty = feature disabled.
  SessionsTableName:
    Type: String
    Default: ""
    Description: DynamoDB sessions table name.
  OtpTableName:
    Type: String
    Default: ""
    Description: DynamoDB OTP table name.

  NotificationsTableName:
    Type: String
    Default: ""
    Description: DynamoDB notifications table name.

  # ─── Feature toggles (add Lambdas when ready) ─────────────────────
  EnableEventsApi:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Events Lambda.
  EnableHomePageApi:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Home Page Lambda (feed, profile, social graph, settings).
  EnableMessagingApi:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Messaging Lambda (DMs, group chat).
  EnableProfileApi:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Profile Lambda.

Conditions:
  HasEventsApi:
    Fn::Equals:
      - Ref: EnableEventsApi
      - "true"
  HasHomePageApi:
    Fn::Equals:
      - Ref: EnableHomePageApi
      - "true"
  HasMessagingApi:
    Fn::Equals:
      - Ref: EnableMessagingApi
      - "true"
  HasProfileApi:
    Fn::Equals:
      - Ref: EnableProfileApi
      - "true"
  HasUsersTable:
    Fn::Not:
      - Fn::Equals:
          - Ref: UsersTableName
          - ""

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128 # ← Free tier: 128MB is cheapest
    Environment:
      Variables:
        APP_ENVIRONMENT:
          Ref: EnvironmentName
        TEST_OTP_MODE:
          Ref: TestOtpMode
        ALLOW_FIXED_TEST_OTP:
          Ref: AllowFixedTestOtp
        ALLOW_MISSING_CLAIMS_FALLBACK: "false"
        AUTH_DB_HOST:
          Ref: AuthDbHost
        AUTH_DB_PORT:
          Ref: AuthDbPort
        AUTH_DB_NAME:
          Ref: AuthDbName
        AUTH_DB_USER:
          Ref: AuthDbUser
        AUTH_DB_PASSWORD:
          Ref: AuthDbPassword
        AUTH_DB_CONNECT_TIMEOUT:
          Ref: AuthDbConnectTimeout
        COGNITO_REGION:
          Ref: AWS::Region
        R2_BUCKET_NAME:
          Ref: R2BucketName
        R2_ENDPOINT:
          Ref: R2Endpoint
        USERS_TABLE_NAME:
          Fn::Sub: Happnix-userInfoTable-${EnvironmentName}
        SESSIONS_TABLE_NAME:
          Fn::Sub: HappniX-sessions-v2-${EnvironmentName}
        OTP_TABLE_NAME:
          Fn::Sub: HappniX-otp-v2-${EnvironmentName}

        NOTIFICATIONS_TABLE_NAME:
          Ref: NotificationsTableName

        # ── Feature table names (used by HomePageApi, EventsApi etc.) ───────
        SOCIAL_TABLE_NAME:
          Fn::Sub: HappniX-social-${EnvironmentName}
        EVENTS_TABLE_NAME:
          Fn::Sub: HappniX-events-${EnvironmentName}
        SETTINGS_TABLE_NAME:
          Fn::Sub: HappniX-settings-${EnvironmentName}

        COGNITO_USER_POOL_ID:
          Ref: HappnixUserPool
        COGNITO_USER_POOL_CLIENT_ID:
          Ref: HappnixUserPoolClient
        # JWT sessions table — stores one refresh token per user-device (30-day TTL)
        JWT_SESSIONS_TABLE_NAME:
          Fn::Sub: HappniX-jwt-sessions-${EnvironmentName}
    VpcConfig:
      SecurityGroupIds:
        - Ref: LambdaSecurityGroupId
      SubnetIds:
        - Ref: PrivateSubnetAId
        - Ref: PrivateSubnetBId

Resources:
  # ══════════════════════════════════════════════════════════════════════
  # API Gateway — Free Tier: 1M REST API calls/month (12 months)
  # ══════════════════════════════════════════════════════════════════════
  HappnixDevApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: HappniX-${EnvironmentName}-api
      StageName:
        Ref: EnvironmentName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Requested-With,X-CSRFToken,X-Happnix-Trace-Id,X-HappniX-PreAuth'"
        AllowOrigin: "'*'"
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          ThrottlingRateLimit: 100 # 100 requests/sec steady state
          ThrottlingBurstLimit: 50 # 50 concurrent burst

  # ══════════════════════════════════════════════════════════════════════
  # Cognito — Free Tier: LITE tier = 10K MAU free (always free)
  # Supports 3 login methods:
  #   1. Email + Password      → AliasAttributes: email
  #   2. Username + Password   → Cognito native username (case-insensitive)
  #   3. Mobile + OTP          → AliasAttributes: phone_number + CUSTOM_AUTH
  # ══════════════════════════════════════════════════════════════════════
  HappnixUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: HappniX-${EnvironmentName}-user-pool
      DeletionProtection: ACTIVE
      AliasAttributes:
        # ← Users can sign in with any of these
        - email #   email + password
        - phone_number #   mobile + OTP
        - preferred_username #   username + password
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false # ← "Ronak" = "ronak"
      Schema:
        - Name: email
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: phone_number
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: dateOfBirth
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: userType
          AttributeDataType: String
          Required: false
          Mutable: true
      LambdaConfig:
        PreTokenGenerationConfig:
          LambdaArn:
            Fn::GetAtt:
              - CognitoPreToken
              - Arn
          LambdaVersion: V2_0

  HappnixUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: HappniX-${EnvironmentName}-web-client
      UserPoolId:
        Ref: HappnixUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH # ← Server-side auth from Lambda (AdminInitiateAuth)
        - ALLOW_USER_PASSWORD_AUTH # ← Email/Username + Password (client-side)
        - ALLOW_USER_SRP_AUTH # ← Secure Remote Password (client-side)
        - ALLOW_REFRESH_TOKEN_AUTH # ← Token refresh
        - ALLOW_CUSTOM_AUTH # ← Mobile + OTP (custom challenge)
      SupportedIdentityProviders:
        - COGNITO

  # ══════════════════════════════════════════════════════════════════════
  # Core Auth Lambdas (always enabled)
  # Free Tier: 1M requests + 400K GB-seconds/month (always free)
  # ══════════════════════════════════════════════════════════════════════
  SignupSignin:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/
      Handler: handlers.signup_signin.lambda_handler
      Description: HappniX signup and signin Lambda function.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-userInfoTable-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-userInfoTable-${EnvironmentName}/index/*"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}/index/*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminGetUser
                - cognito-idp:ListUsers
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:GetUser # verify_cognito_token (Bearer token validation)
                - cognito-idp:GlobalSignOut # Logout action
              Resource:
                Fn::GetAtt:
                  - HappnixUserPool
                  - Arn
      Events:
        AuthAction:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/auth
            Method: POST
        AuthActionLegacy:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /auth
            Method: POST

  DevOnly:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/
      Handler: handlers.dev_only.lambda_handler
      Description: HappniX dev-only utilities (wipe users, get auth config).
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:DescribeUserPool
                - cognito-idp:ListUsers
                - cognito-idp:AdminDeleteUser
              Resource:
                Fn::GetAtt:
                  - HappnixUserPool
                  - Arn
      Events:
        DevAction:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/dev_only
            Method: POST

  CognitoPreToken:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/
      Handler: handlers.CognitoPreToken.lambda_handler
      Description: Inject userID and userType claims from HappniX PostgreSQL.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: ""
          COGNITO_USER_POOL_CLIENT_ID: ""

  AuthSchemaInit:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../backend/
      Handler: handlers.AuthSchemaInit.lambda_handler
      Description: Initialize HappniX auth schema in PostgreSQL. Invoke manually or via CI/CD.
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole

  # ── Cognito Invoke Permissions ─────────────────────────────────────
  CognitoPreTokenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: CognitoPreToken
      Principal: cognito-idp.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::GetAtt:
          - HappnixUserPool
          - Arn

  # NOTE: Schema is initialized manually via:
  #   psql -h <RDS_HOST> -U <USER> -d <DB> -f backend/schemas/happnix_auth_schema.sql
  # CloudFormation Custom Resource was removed — the AuthSchemaInit Lambda could not
  # reach the CloudFormation ResponseURL (S3 pre-signed URL) from inside a private VPC
  # without an S3 VPC endpoint. Run schema migrations manually or via a bastion host.

  # ══════════════════════════════════════════════════════════════════════
  # Feature Lambdas — each toggled independently.
  # Set EnableEventsApi=true (etc.) when you've written the handler.
  # These are STUBS — update Handler/CodeUri when your code is ready.
  # ══════════════════════════════════════════════════════════════════════

  # ── Home Page Lambda (replaces ProfilesApi) ───────────────────────────────
  HomePageApi:
    Type: AWS::Serverless::Function
    Condition: HasHomePageApi
    Properties:
      CodeUri: ../../backend/
      Handler: handlers.home_page.lambda_handler
      Description: Home page — feed, live events, profile, social graph, search, settings.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}/index/*"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}/index/*"
            - Effect: Allow
              Action:
                - cognito-idp:GetUser # verify_cognito_token (Bearer token validation)
              Resource: "*"
      Events:
        HomeFeed:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/home/feed
            Method: GET
        HomeLive:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/home/live
            Method: GET
        HomeNearby:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/home/nearby
            Method: GET
        TicketsForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/tickets
            Method: GET
        BookTicketForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/tickets/book
            Method: POST
        UpdateTicketForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/tickets/{id}/{action}
            Method: POST
        DeleteTicketForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/tickets/{id}/delete
            Method: DELETE
        NotificationsForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/notifications
            Method: GET
        MarkNotificationsForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/notifications
            Method: POST
        NotificationActivityForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/notifications/activity
            Method: POST
        GuestInvitesForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/guest-invites
            Method: POST
        UpdateGuestInviteForHome:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/guest-invites/{token}/{action}
            Method: POST
        MyProfile:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/profile/me
            Method: GET
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/profile/update
            Method: POST
        ProfilePrivacy:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/profile/privacy
            Method: POST
        GetFollowing:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/profile/following
            Method: GET
        GetFollowers:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/profile/followers
            Method: GET
        FollowRequests:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/profile/follow-requests
            Method: GET
        HandleFollowRequest:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/profile/follow-requests
            Method: POST
        SearchUsers:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/users/search
            Method: GET
        FollowUser:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/users/follow
            Method: POST
        PublicProfile:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/users/{id}/profile
            Method: GET
        GetPreferences:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/settings/preferences
            Method: GET
        SavePreferences:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/settings/preferences
            Method: POST
        GetPeople:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/settings/people/{category}
            Method: GET
        AddPerson:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/settings/people/{category}
            Method: POST
        RemovePerson:
          Type: Api
          Properties:
            RestApiId: { Ref: HappnixDevApi }
            Path: /api/settings/people/{category}
            Method: DELETE

  EventsApi:
    Type: AWS::Serverless::Function
    Condition: HasEventsApi
    Properties:
      CodeUri: ../../backend/
      Handler: handlers.events.lambda_handler
      Description: Events CRUD — create, list, discover, delete.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}/index/*"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}/index/*"
            - Effect: Allow
              Action:
                - cognito-idp:GetUser # verify_cognito_token (Bearer token validation)
              Resource: "*"
      Events:
        CreateEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/events/create
            Method: POST
        MyEvents:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/events/mine
            Method: GET
        NearbyEvents:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/events/nearby
            Method: GET
        LiveEvents:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/events/live
            Method: GET
        GetEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/events/{id}
            Method: GET
        DeleteEvent:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/events/{id}
            Method: DELETE

  MessagingApi:
    Type: AWS::Serverless::Function
    Condition: HasMessagingApi
    Properties:
      CodeUri: ../../backend/
      Handler: handlers.messaging.lambda_handler
      Description: Direct messaging — conversations, messages, attachments.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}/index/*"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}/index/*"
            - Effect: Allow
              Action:
                - cognito-idp:GetUser # verify_cognito_token (Bearer token validation)
              Resource: "*"
      Events:
        ListConversations:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/conversations
            Method: GET
        StartConversation:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/conversations/start
            Method: POST
        ConversationMessages:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/conversations/{id}/messages
            Method: GET
        SendConversationMessage:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/conversations/{id}/messages
            Method: POST
        MarkRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/conversations/{id}/read
            Method: POST
        EditMessage:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/messages/{id}/edit
            Method: POST
        ForwardMessage:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/messages/{id}/forward
            Method: POST
        DeleteMessage:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/messages/{id}/delete
            Method: POST
        UnsendMessage:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/messages/{id}/unsend
            Method: POST
        CreateGroupConversation:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/groups/create
            Method: POST
        GroupConversationMessages:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/groups/{id}/messages
            Method: GET
        UpdateGroupConversation:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/groups/{id}/{action}
            Method: POST
        UpdateGroupMessage:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/messages/group-messages/{id}/{action}
            Method: POST

  ProfileApi:
    Type: AWS::Serverless::Function
    Condition: HasProfileApi
    Properties:
      CodeUri: ../../backend/
      Handler: profile.lambda_handler
      Description: Deep profile operations — Aadhaar verification, settings, notifications.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/Happnix-*-${EnvironmentName}/index/*"
                - Fn::Sub: "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HappniX-*-${EnvironmentName}/index/*"
            - Effect: Allow
              Action:
                - cognito-idp:GetUser # verify_cognito_token (Bearer token validation)
                - cognito-idp:AdminDeleteUser # DeleteAccount action
              Resource:
                Fn::GetAtt:
                  - HappnixUserPool
                  - Arn
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/profile/{id}
            Method: GET
        SendAadhaarOtp:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/profile/verify/aadhaar/send
            Method: POST
        VerifyAadhaarOtp:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/profile/verify/aadhaar/verify
            Method: POST
        UploadProfilePicture:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/profile/picture/upload
            Method: POST
        GetNotifications:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/profile/notifications
            Method: GET
        MarkNotificationsRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: HappnixDevApi
            Path: /api/profile/notifications/read
            Method: POST

Outputs:
  HappnixApiUrl:
    Description: Invoke URL for the HappniX API.
    Value:
      Fn::Sub:
        "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${E\
        nvironmentName}"
  HappnixCognitoRegion:
    Description: Cognito region.
    Value:
      Ref: AWS::Region
  HappnixUserPoolId:
    Description: Cognito User Pool ID.
    Value:
      Ref: HappnixUserPool
  HappnixUserPoolClientId:
    Description: Cognito User Pool client ID.
    Value:
      Ref: HappnixUserPoolClient
