AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  HappniX data stack — dev environment.
  Free tier optimized. Each resource is independently toggleable.
  RDS db.t4g.micro (free tier). DynamoDB on-demand (always free 25 WCU/RCU).

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  ApplicationTag:
    Type: String
    Default: ""
    Description: ARN from AWS myApplications.

  # ─── RDS Toggle ─────────────────────────────────────────────────────
  EnableRds:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable RDS PostgreSQL (free tier db.t4g.micro for 12 months).
  PrivateSubnetAId:
    Type: String
    Default: ""
  PrivateSubnetBId:
    Type: String
    Default: ""
  DatabaseSecurityGroupId:
    Type: String
    Default: ""
  AuthDbName:
    Type: String
    Default: "happnix_in_dev"
  AuthDbUser:
    Type: String
    Default: "happnixadmin"
  AuthDbPassword:
    Type: String
    NoEcho: true
    Default: "changeme"

  # ─── DynamoDB Table Toggles ─────────────────────────────────────────
  # Turn on/off any table independently. Only creates what you need NOW.
  EnableUsersTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: DynamoDB users table for username lookups (free tier).
  EnableSessionsTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: DynamoDB sessions table — replaces dev_store.py.
  EnableOtpTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: DynamoDB OTP table with 5-min TTL.
  EnableConnectionsTable:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: DynamoDB WebSocket connections registry.
  EnablePresenceTable:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: DynamoDB presence table for online/offline.
  EnableNotificationsTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: DynamoDB notifications table.

  # ─── Feature Table Toggles ─────────────────────────────────────────
  EnableSocialTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Social graph (follows, follow-requests). Required by HomePageApi.
  EnableEventsTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Events table (live, upcoming, nearby). Required by HomePageApi.
  EnableSettingsTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: User preferences, blocked/muted lists. Required by HomePageApi.
  EnableJwtSessionsTable:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: JWT refresh-token session store (one row per user-device, 30-day TTL).


Conditions:
  HasRds:
    Fn::Equals:
      - Ref: EnableRds
      - "true"
  HasUsersTable:
    Fn::Equals:
      - Ref: EnableUsersTable
      - "true"
  HasSessionsTable:
    Fn::Equals:
      - Ref: EnableSessionsTable
      - "true"
  HasOtpTable:
    Fn::Equals:
      - Ref: EnableOtpTable
      - "true"
  HasConnectionsTable:
    Fn::Equals:
      - Ref: EnableConnectionsTable
      - "true"
  HasPresenceTable:
    Fn::Equals:
      - Ref: EnablePresenceTable
      - "true"
  HasNotificationsTable:
    Fn::Equals:
      - Ref: EnableNotificationsTable
      - "true"
  HasSocialTable:
    Fn::Equals:
      - Ref: EnableSocialTable
      - "true"
  HasEventsTable:
    Fn::Equals:
      - Ref: EnableEventsTable
      - "true"
  HasSettingsTable:
    Fn::Equals:
      - Ref: EnableSettingsTable
      - "true"
  HasJwtSessionsTable:
    Fn::Equals:
      - Ref: EnableJwtSessionsTable
      - "true"


Resources:

  # ══════════════════════════════════════════════════════════════════════
  # RDS PostgreSQL — Free Tier: db.t4g.micro, 20GB, 750 hrs/mo (12 months)
  # ══════════════════════════════════════════════════════════════════════
  HappnixDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: HasRds
    Properties:
      DBSubnetGroupDescription:
        Fn::Sub: Subnets for HappniX-${EnvironmentName} postgres
      SubnetIds:
        - Ref: PrivateSubnetAId
        - Ref: PrivateSubnetBId

  HappnixPostgresDatabase:
    Type: AWS::RDS::DBInstance
    Condition: HasRds
    Properties:
      DBInstanceIdentifier:
        Fn::Sub: happnix-postgres-${EnvironmentName}-v2
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: db.t4g.micro        # ← Free tier eligible (12 months)
      AllocatedStorage: "20"               # ← Free tier limit: 20 GB
      StorageType: gp2                     # ← Free tier (gp3 not free tier)
      PubliclyAccessible: false
      MultiAZ: false                       # ← Multi-AZ is NOT free tier
      DBName:
        Ref: AuthDbName
      MasterUsername:
        Ref: AuthDbUser
      MasterUserPassword:
        Ref: AuthDbPassword
      Port: 5432
      BackupRetentionPeriod: 1             # ← Minimum (0 disables, 1 is free)
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      DBSubnetGroupName:
        Ref: HappnixDbSubnetGroup
      VPCSecurityGroups:
        - Ref: DatabaseSecurityGroupId

  # ══════════════════════════════════════════════════════════════════════
  # DynamoDB — Always Free Tier: 25 WCU, 25 RCU, 25 GB storage
  # PAY_PER_REQUEST = on-demand = auto-scales within free tier limits
  # ══════════════════════════════════════════════════════════════════════

  # ─── Users Table (User Profiles & Personal Details) ───────────────────
  HappnixUserTable:
    Type: AWS::DynamoDB::Table
    Condition: HasUsersTable
    Properties:
      TableName:
        Fn::Sub: HappniX-User-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userID
          AttributeType: S
        - AttributeName: userEntity
          AttributeType: S
      KeySchema:
        - AttributeName: userID
          KeyType: HASH
        - AttributeName: userEntity
          KeyType: RANGE
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-User-${EnvironmentName}

  # ─── Sessions Table (replaces dev_store.py JSON file) ──────────────
  HappnixSessionsTable:
    Type: AWS::DynamoDB::Table
    Condition: HasSessionsTable
    Properties:
      TableName:
        Fn::Sub: HappniX-sessions-v2-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionToken
          AttributeType: S
      KeySchema:
        - AttributeName: sessionToken
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-sessions-v2-${EnvironmentName}

  # ─── OTP Table (5-minute TTL auto-cleanup) ─────────────────────────
  HappnixOtpTable:
    Type: AWS::DynamoDB::Table
    Condition: HasOtpTable
    Properties:
      TableName:
        Fn::Sub: HappniX-otp-v2-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mobile
          AttributeType: S
      KeySchema:
        - AttributeName: mobile
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-otp-v2-${EnvironmentName}

  # ─── WebSocket Connections Registry ────────────────────────────────
  HappnixConnectionsTable:
    Type: AWS::DynamoDB::Table
    Condition: HasConnectionsTable
    Properties:
      TableName:
        Fn::Sub: HappniX-connections-v2-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-connections-v2-${EnvironmentName}

  # ─── Presence (online/offline with heartbeat TTL) ──────────────────
  HappnixPresenceTable:
    Type: AWS::DynamoDB::Table
    Condition: HasPresenceTable
    Properties:
      TableName:
        Fn::Sub: HappniX-presence-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-presence-${EnvironmentName}

  # ─── Notifications ─────────────────────────────────────────────────
  HappnixNotificationsTable:
    Type: AWS::DynamoDB::Table
    Condition: HasNotificationsTable
    Properties:
      TableName:
        Fn::Sub: HappniX-notifications-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recipientUserId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: recipientUserId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-notifications-${EnvironmentName}

  # ─── Social Graph (follows, follow-requests) ───────────────────────
  HappnixSocialTable:
    Type: AWS::DynamoDB::Table
    Condition: HasSocialTable
    Properties:
      TableName:
        Fn::Sub: HappniX-social-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cognitoSub
          AttributeType: S
        - AttributeName: relationKey
          AttributeType: S
        - AttributeName: targetSub
          AttributeType: S
      KeySchema:
        - AttributeName: cognitoSub
          KeyType: HASH
        - AttributeName: relationKey
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: targetSub-index
          KeySchema:
            - AttributeName: targetSub
              KeyType: HASH
            - AttributeName: cognitoSub
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-social-${EnvironmentName}

  # ─── Events (Single-Table: EVENT_CARD, FEED_POST, FEED_EVENT, CELEB, PREF_CLUSTER) ──
  HappnixEventsTableV2:
    Type: AWS::DynamoDB::Table
    Condition: HasEventsTable
    Properties:
      TableName:
        Fn::Sub: HappniX-events-v2-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: discoverShard
          AttributeType: S
        - AttributeName: engagementSortKey
          AttributeType: S
        - AttributeName: eventCategory
          AttributeType: S
        - AttributeName: startAt
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Sharded global algorithm feed (PK = DISCOVER#SHARD_0..9)
        - IndexName: GSI-Discover
          KeySchema:
            - AttributeName: discoverShard
              KeyType: HASH
            - AttributeName: engagementSortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Browse events by category, sorted by start date
        - IndexName: GSI-Category
          KeySchema:
            - AttributeName: eventCategory
              KeyType: HASH
            - AttributeName: startAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-events-v2-${EnvironmentName}

  # ─── Settings (preferences, blocked, muted) ────────────────────────
  HappnixSettingsTable:
    Type: AWS::DynamoDB::Table
    Condition: HasSettingsTable
    Properties:
      TableName:
        Fn::Sub: HappniX-settings-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cognitoSub
          AttributeType: S
        - AttributeName: settingKey
          AttributeType: S
      KeySchema:
        - AttributeName: cognitoSub
          KeyType: HASH
        - AttributeName: settingKey
          KeyType: RANGE
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-settings-${EnvironmentName}

  # ─── JWT Sessions (refresh-token store, one row per user-device) ──────────
  # PK: cognitoSub   SK: sessionId
  # TTL: expiresAt   (30 days — mirrors Cognito refresh-token lifetime)
  HappnixJwtSessionsTable:
    Type: AWS::DynamoDB::Table
    Condition: HasJwtSessionsTable
    Properties:
      TableName:
        Fn::Sub: HappniX-jwt-sessions-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cognitoSub
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: cognitoSub
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: HappniX-jwt-sessions-${EnvironmentName}


# ══════════════════════════════════════════════════════════════════════
# Outputs — conditional so they only appear when the resource exists
# ══════════════════════════════════════════════════════════════════════
Outputs:
  # RDS
  DatabaseEndpointAddress:
    Condition: HasRds
    Description: PostgreSQL endpoint address.
    Value:
      Fn::GetAtt:
        - HappnixPostgresDatabase
        - Endpoint.Address
  DatabaseEndpointPort:
    Condition: HasRds
    Description: PostgreSQL endpoint port.
    Value:
      Fn::GetAtt:
        - HappnixPostgresDatabase
        - Endpoint.Port
  DatabaseInstanceIdentifier:
    Condition: HasRds
    Description: PostgreSQL instance identifier.
    Value:
      Ref: HappnixPostgresDatabase

  # DynamoDB
  UsersTableName:
    Condition: HasUsersTable
    Description: DynamoDB users table name.
    Value:
      Ref: HappnixUserTable
  UsersTableArn:
    Condition: HasUsersTable
    Description: DynamoDB users table ARN.
    Value:
      Fn::GetAtt:
        - HappnixUserTable
        - Arn
  SessionsTableName:
    Condition: HasSessionsTable
    Description: DynamoDB sessions table name.
    Value:
      Ref: HappnixSessionsTable
  OtpTableName:
    Condition: HasOtpTable
    Description: DynamoDB OTP table name.
    Value:
      Ref: HappnixOtpTable
  ConnectionsTableName:
    Condition: HasConnectionsTable
    Description: DynamoDB connections table name.
    Value:
      Ref: HappnixConnectionsTable
  PresenceTableName:
    Condition: HasPresenceTable
    Description: DynamoDB presence table name.
    Value:
      Ref: HappnixPresenceTable
  NotificationsTableName:
    Condition: HasNotificationsTable
    Description: DynamoDB notifications table name.
    Value:
      Ref: HappnixNotificationsTable
  SocialTableName:
    Condition: HasSocialTable
    Description: DynamoDB social graph table name.
    Value:
      Ref: HappnixSocialTable
  EventsTableName:
    Condition: HasEventsTable
    Description: DynamoDB events table name.
    Value:
      Ref: HappnixEventsTableV2
  SettingsTableName:
    Condition: HasSettingsTable
    Description: DynamoDB settings table name.
    Value:
      Ref: HappnixSettingsTable
  JwtSessionsTableName:
    Condition: HasJwtSessionsTable
    Description: DynamoDB JWT sessions table name (refresh-token store).
    Value:
      Ref: HappnixJwtSessionsTable
