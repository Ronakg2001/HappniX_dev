name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - "web_frontend/**"
      - ".github/workflows/frontend_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write runtime config
        shell: bash
        run: |
          cat <<EOF > runtime-config.js
          window.HAPPNIX_RUNTIME_CONFIG = {
            apiBaseUrl: "${{ secrets.API_BASE_URL }}"
          };
          EOF

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web_frontend
          command: deploy
