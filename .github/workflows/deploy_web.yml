name: Deploy Web Frontend

on:
  push:
    branches:
      - dev
    paths:
      - "web/**"
      - ".github/workflows/deploy_web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js app
        working-directory: web
        env:
          NEXT_PUBLIC_R2_STATIC_MEDIA_BUCKET_PUBID: ${{ vars.NEXT_PUBLIC_R2_STATIC_MEDIA_BUCKET_PUBID }}
          NEXT_PUBLIC_R2_USERMEDIA_BUCKET_PUBID: ${{ vars.NEXT_PUBLIC_R2_USERMEDIA_BUCKET_PUBID }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy out --project-name happnix-dev-new
