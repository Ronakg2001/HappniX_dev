name: Deploy App

on:
  push:
    branches:
      - dev
    paths:
      - "infra/app/**"
      - "backend/**"
      - ".github/workflows/deploy_app.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-1
      STACK_NAME: happnix-app-dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Build app stack
        run: sam build --use-container --template-file infra/app/template.yaml

      - name: Deploy app stack
        run: >
          sam deploy
          --stack-name "${STACK_NAME}"
          --template-file .aws-sam/build/template.yaml
          --resolve-s3
          --region "ap-south-1"
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --capabilities CAPABILITY_IAM
          --parameter-overrides
          ParameterKey=EnvironmentName,ParameterValue=dev
          ParameterKey=EnableEventsApi,ParameterValue=true
          ParameterKey=VpcId,ParameterValue='${{ vars.NETWORK_VPC_ID }}'
          ParameterKey=PrivateSubnetAId,ParameterValue='${{ vars.NETWORK_PRIVATE_SUBNET_A_ID }}'
          ParameterKey=PrivateSubnetBId,ParameterValue='${{ vars.NETWORK_PRIVATE_SUBNET_B_ID }}'
          ParameterKey=LambdaSecurityGroupId,ParameterValue='${{ vars.NETWORK_LAMBDA_SECURITY_GROUP_ID }}'
          ParameterKey=AuthDbHost,ParameterValue='${{ vars.DATA_DB_HOST }}'
          ParameterKey=AuthDbPort,ParameterValue='${{ vars.DATA_DB_PORT }}'
          ParameterKey=AuthDbName,ParameterValue='${{ vars.AUTH_DB_NAME }}'
          ParameterKey=AuthDbUser,ParameterValue='${{ vars.AUTH_DB_USER }}'
          ParameterKey=AuthDbPassword,ParameterValue='${{ secrets.AUTH_DB_PASSWORD }}'
          ParameterKey=AuthDbConnectTimeout,ParameterValue=5
          ParameterKey=TestOtpMode,ParameterValue=true
          ParameterKey=AllowFixedTestOtp,ParameterValue=true
          ParameterKey=R2UserMediaBucketName,ParameterValue='${{ secrets.R2_USERMEDIA_BUCKET }}'
          ParameterKey=R2UserMediaBucketPubId,ParameterValue='${{ vars.NEXT_PUBLIC_R2_USERMEDIA_BUCKET_PUBID }}'
          ParameterKey=R2StaticMediaBucketName,ParameterValue='${{ secrets.R2_STATIC_MEDIA_BUCKET }}'
          ParameterKey=R2Endpoint,ParameterValue='${{ secrets.R2_ENDPOINT }}'
          ParameterKey=CloudflareAccountId,ParameterValue='${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          ParameterKey=R2AccessKeyId,ParameterValue='${{ secrets.R2_ACCESS_KEY_ID }}'
          ParameterKey=R2SecretAccessKey,ParameterValue='${{ secrets.R2_SECRET_ACCESS_KEY }}'
          ParameterKey=UsersTableName,ParameterValue='HappniX-users-dev'
          ParameterKey=SessionsTableName,ParameterValue='HappniX-sessions-dev'
          ParameterKey=OtpTableName,ParameterValue='HappniX-otp-dev'
          ParameterKey=FrontendUrl,ParameterValue='https://happnix-dev-new.ronakgo1.workers.dev'

      - name: Initialize Database Schema
        run: |
          echo "Invoking AuthSchemaInit to apply SQL schema to RDS..."
          aws lambda invoke --function-name HappniX-dev-AuthSchemaInit response.json
          cat response.json

      # ── Post-deploy smoke test ───────────────────────────────────────
      # Invoke every Lambda with a minimal event to verify cold-start
      # succeeds (no import errors). If ANY function fails to start,
      # this step fails the entire workflow so you know immediately.
      - name: Smoke test — verify all Lambdas can cold-start
        run: |
          set -e
          echo "🔍 Running cold-start smoke tests..."

          FUNCTIONS=$(aws cloudformation list-stack-resources \
            --stack-name "${STACK_NAME}" \
            --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
            --output text)

          FAILED=0
          for FUNC in $FUNCTIONS; do
            echo ""
            echo "━━━ Testing: $FUNC ━━━"

            aws lambda invoke \
              --function-name "$FUNC" \
              --payload '{}' \
              --log-type Tail \
              /tmp/response.json 2>/tmp/invoke_err.txt || true

            if grep -q "FunctionError" /tmp/invoke_err.txt 2>/dev/null; then
              echo "❌ FAILED: $FUNC"
              cat /tmp/response.json
              FAILED=$((FAILED + 1))
            else
              STATUS=$(cat /tmp/response.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('statusCode','N/A'))" 2>/dev/null || echo "N/A")
              echo "✅ OK (status: $STATUS)"
            fi
          done

          echo ""
          if [ $FAILED -gt 0 ]; then
            echo "❌ $FAILED Lambda(s) failed cold-start smoke test!"
            exit 1
          else
            echo "✅ All Lambdas passed cold-start smoke test!"
          fi
