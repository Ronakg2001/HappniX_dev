AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HappniX backend deployment skeleton for the dev environment.

Parameters:
  ApiStageName:
    Type: String
    Default: dev
  AppEnvironment:
    Type: String
    Default: dev
  R2BucketName:
    Type: String
    Default: ""
  R2Endpoint:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        APP_ENVIRONMENT: !Ref AppEnvironment
        R2_BUCKET_NAME: !Ref R2BucketName
        R2_ENDPOINT: !Ref R2Endpoint

Resources:
  SignupSignin:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: SignupSignin.lambda_handler
      Description: HappniX signup and signin Lambda function.
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        SendMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/send-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        ResendMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/resend-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        VerifyMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/verify-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        ForgotPassword:
          Type: Api
          Properties:
            Path: /api/auth/password/forgot
            Method: post
            RestApiId: !Ref HappnixDevApi
        LoginWithPassword:
          Type: Api
          Properties:
            Path: /api/auth/username/login
            Method: post
            RestApiId: !Ref HappnixDevApi
        SignupDetails:
          Type: Api
          Properties:
            Path: /api/signup/details
            Method: post
            RestApiId: !Ref HappnixDevApi
        SignupProfile:
          Type: Api
          Properties:
            Path: /api/signup/profile
            Method: post
            RestApiId: !Ref HappnixDevApi
        SendAadhaarOtp:
          Type: Api
          Properties:
            Path: /api/auth/aadhaar/send-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        VerifyAadhaarOtp:
          Type: Api
          Properties:
            Path: /api/auth/aadhaar/verify-otp
            Method: post
            RestApiId: !Ref HappnixDevApi

  HappnixDevApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: happnix-dev-api
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
        AllowOrigin: "'*'"

Outputs:
  HappnixApiUrl:
    Description: Invoke URL for the HappniX deployment skeleton API.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}"
  SignupSigninUrl:
    Description: Auth entry endpoint for the HappniX API.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/api/auth/mobile/send-otp"
