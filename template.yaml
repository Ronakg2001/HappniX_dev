AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HappniX backend deployment skeleton for the dev environment.

Parameters:
  ApiStageName:
    Type: String
    Default: dev
  AppEnvironment:
    Type: String
    Default: dev
  R2BucketName:
    Type: String
    Default: ""
  R2Endpoint:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        APP_ENVIRONMENT: !Ref AppEnvironment
        TEST_OTP_MODE: "false"
        ALLOW_FIXED_TEST_OTP: "false"
        ALLOW_MISSING_CLAIMS_FALLBACK: "false"
        AUTH_DB_HOST: ""
        AUTH_DB_PORT: "5432"
        AUTH_DB_NAME: ""
        AUTH_DB_USER: ""
        AUTH_DB_PASSWORD: ""
        AUTH_DB_CONNECT_TIMEOUT: "5"
        R2_BUCKET_NAME: !Ref R2BucketName
        R2_ENDPOINT: !Ref R2Endpoint

Resources:
  HappnixUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: happnix-dev-user-pool
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      AliasAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: true
        DeviceOnlyRememberedOnUserPrompt: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: HappniX verification code
        EmailMessage: "Your HappniX verification code is {####}"
      LambdaConfig:
        PostConfirmation: !GetAtt CognitoPostConfirmation.Arn
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt CognitoPreToken.Arn
          LambdaVersion: V2_0
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
          StringAttributeConstraints:
            MinLength: "5"
            MaxLength: "255"
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "10"
            MaxLength: "20"
        - Name: userType
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "3"
            MaxLength: "20"
        - Name: dateOfBirth
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "10"
            MaxLength: "10"

  HappnixUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: happnix-dev-web-client
      UserPoolId: !Ref HappnixUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes:
        - email
        - email_verified
        - phone_number
        - phone_number_verified
        - preferred_username
        - custom:userType
        - custom:dateOfBirth
      WriteAttributes:
        - email
        - phone_number
        - preferred_username
        - custom:userType
        - custom:dateOfBirth

  CognitoPostConfirmation:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: CognitoPostConfirmation.lambda_handler
      Description: Sync confirmed Cognito users into HappniX PostgreSQL.
      Policies:
        - AWSLambdaBasicExecutionRole

  CognitoPreToken:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: CognitoPreToken.lambda_handler
      Description: Inject userID and userType claims from HappniX PostgreSQL.
      Policies:
        - AWSLambdaBasicExecutionRole

  CognitoPostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPostConfirmation
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  CognitoPreTokenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPreToken
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  SignupSignin:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: SignupSignin.lambda_handler
      Description: HappniX signup and signin Lambda function.
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        SendMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/send-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        ResendMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/resend-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        VerifyMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/verify-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        ForgotPassword:
          Type: Api
          Properties:
            Path: /api/auth/password/forgot
            Method: post
            RestApiId: !Ref HappnixDevApi
        LoginWithPassword:
          Type: Api
          Properties:
            Path: /api/auth/username/login
            Method: post
            RestApiId: !Ref HappnixDevApi
        SignupDetails:
          Type: Api
          Properties:
            Path: /api/signup/details
            Method: post
            RestApiId: !Ref HappnixDevApi
        SignupProfile:
          Type: Api
          Properties:
            Path: /api/signup/profile
            Method: post
            RestApiId: !Ref HappnixDevApi
        SendAadhaarOtp:
          Type: Api
          Properties:
            Path: /api/auth/aadhaar/send-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        VerifyAadhaarOtp:
          Type: Api
          Properties:
            Path: /api/auth/aadhaar/verify-otp
            Method: post
            RestApiId: !Ref HappnixDevApi

  HappnixDevApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: happnix-dev-api
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
        AllowOrigin: "'*'"

Outputs:
  HappnixApiUrl:
    Description: Invoke URL for the HappniX deployment skeleton API.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}"
  SignupSigninUrl:
    Description: Auth entry endpoint for the HappniX API.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/api/auth/mobile/send-otp"
  HappnixUserPoolId:
    Description: Cognito User Pool ID for HappniX authentication.
    Value: !Ref HappnixUserPool
  HappnixUserPoolClientId:
    Description: Cognito App Client ID for HappniX authentication.
    Value: !Ref HappnixUserPoolClient
  HappnixUserPoolArn:
    Description: Cognito User Pool ARN for HappniX authentication.
    Value: !GetAtt HappnixUserPool.Arn
