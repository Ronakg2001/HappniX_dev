AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HappniX backend deployment skeleton for the dev environment.

Parameters:
  ApiStageName:
    Type: String
    Default: dev
  AppEnvironment:
    Type: String
    Default: dev
  R2BucketName:
    Type: String
    Default: ""
  R2Endpoint:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        APP_ENVIRONMENT: !Ref AppEnvironment
        R2_BUCKET_NAME: !Ref R2BucketName
        R2_ENDPOINT: !Ref R2Endpoint

Resources:
  SignupSignin:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: app.lambda_handler
      Description: Minimal HappniX API for deployment verification.
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        SignInEndpoint:
          Type: Api
          Properties:
            Path: /signin
            Method: get
            RestApiId: !Ref HappnixDevApi

  HappnixDevApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: happnix-dev-api
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
        AllowOrigin: "'*'"

Outputs:
  HappnixApiUrl:
    Description: Invoke URL for the HappniX deployment skeleton API.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}"
  SignupSigninUrl:
    Description: Health endpoint for deployment verification.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/signin"
