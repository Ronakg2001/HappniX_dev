AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: HappniX backend deployment skeleton for the dev environment.

Parameters:
  ApiStageName:
    Type: String
    Default: dev
  AppEnvironment:
    Type: String
    Default: dev
  AppVpcId:
    Type: String
    Default: "vpc-010824d98891a054f"
  AppSubnetA:
    Type: String
    Default: "subnet-0bf6a30e0d784a8bd"
  AppSubnetB:
    Type: String
    Default: "subnet-0e20cb82546c2f672"
  AuthDbName:
    Type: String
    Default: ""
  AuthDbUser:
    Type: String
    Default: ""
  AuthDbPassword:
    Type: String
    NoEcho: true
    Default: ""
  AuthDbConnectTimeout:
    Type: String
    Default: "5"
  TestOtpMode:
    Type: String
    Default: "false"
  AllowFixedTestOtp:
    Type: String
    Default: "false"
  R2BucketName:
    Type: String
    Default: ""
  R2Endpoint:
    Type: String
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        APP_ENVIRONMENT: !Ref AppEnvironment
        TEST_OTP_MODE: !Ref TestOtpMode
        ALLOW_FIXED_TEST_OTP: !Ref AllowFixedTestOtp
        ALLOW_MISSING_CLAIMS_FALLBACK: "false"
        AUTH_DB_HOST: !GetAtt HappnixPostgresDatabase.Endpoint.Address
        AUTH_DB_PORT: !GetAtt HappnixPostgresDatabase.Endpoint.Port
        AUTH_DB_NAME: !Ref AuthDbName
        AUTH_DB_USER: !Ref AuthDbUser
        AUTH_DB_PASSWORD: !Ref AuthDbPassword
        AUTH_DB_CONNECT_TIMEOUT: !Ref AuthDbConnectTimeout
        R2_BUCKET_NAME: !Ref R2BucketName
        R2_ENDPOINT: !Ref R2Endpoint
    VpcConfig:
      SecurityGroupIds:
        - !Ref HappnixLambdaSecurityGroup
      SubnetIds:
        - !Ref AppSubnetA
        - !Ref AppSubnetB

Resources:
  HappnixLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for HappniX Lambda functions.
      VpcId: !Ref AppVpcId

  HappnixDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for HappniX PostgreSQL database.
      VpcId: !Ref AppVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref HappnixLambdaSecurityGroup

  HappnixDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for HappniX PostgreSQL database.
      SubnetIds:
        - !Ref AppSubnetA
        - !Ref AppSubnetB

  HappnixPostgresDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: happnix-postgres-dev
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      StorageType: gp2
      PubliclyAccessible: false
      MultiAZ: false
      DBName: !Ref AuthDbName
      MasterUsername: !Ref AuthDbUser
      MasterUserPassword: !Ref AuthDbPassword
      Port: 5432
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      DBSubnetGroupName: !Ref HappnixDbSubnetGroup
      VPCSecurityGroups:
        - !Ref HappnixDatabaseSecurityGroup

  HappnixUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: happnix-dev-user-pool
      UserPoolTier: ESSENTIALS
      DeletionProtection: ACTIVE
      AliasAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: true
        DeviceOnlyRememberedOnUserPrompt: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
        SignInPolicy:
          AllowedFirstAuthFactors:
            - PASSWORD
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: HappniX verification code
        EmailMessage: "Your HappniX verification code is {####}"
      LambdaConfig:
        PostConfirmation: !GetAtt CognitoPostConfirmation.Arn
        PreTokenGenerationConfig:
          LambdaArn: !GetAtt CognitoPreToken.Arn
          LambdaVersion: V2_0
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
          StringAttributeConstraints:
            MinLength: "5"
            MaxLength: "255"
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "10"
            MaxLength: "20"
        - Name: userType
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "3"
            MaxLength: "20"
        - Name: dateOfBirth
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "10"
            MaxLength: "10"

  HappnixUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: happnix-dev-web-client
      UserPoolId: !Ref HappnixUserPool
      GenerateSecret: false
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ReadAttributes:
        - email
        - email_verified
        - phone_number
        - phone_number_verified
        - preferred_username
        - custom:userType
        - custom:dateOfBirth
      WriteAttributes:
        - email
        - phone_number
        - preferred_username
        - custom:userType
        - custom:dateOfBirth

  CognitoPostConfirmation:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: CognitoPostConfirmation.lambda_handler
      Description: Sync confirmed Cognito users into HappniX PostgreSQL.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole

  CognitoPreToken:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: CognitoPreToken.lambda_handler
      Description: Inject userID and userType claims from HappniX PostgreSQL.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole

  CognitoPostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPostConfirmation
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  CognitoPreTokenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CognitoPreToken
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  SignupSignin:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: SignupSignin.lambda_handler
      Description: HappniX signup and signin Lambda function.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        SendMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/send-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        ResendMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/resend-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        VerifyMobileOtp:
          Type: Api
          Properties:
            Path: /api/auth/mobile/verify-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        ForgotPassword:
          Type: Api
          Properties:
            Path: /api/auth/password/forgot
            Method: post
            RestApiId: !Ref HappnixDevApi
        LoginWithPassword:
          Type: Api
          Properties:
            Path: /api/auth/username/login
            Method: post
            RestApiId: !Ref HappnixDevApi
        SignupDetails:
          Type: Api
          Properties:
            Path: /api/signup/details
            Method: post
            RestApiId: !Ref HappnixDevApi
        SignupProfile:
          Type: Api
          Properties:
            Path: /api/signup/profile
            Method: post
            RestApiId: !Ref HappnixDevApi
        SendAadhaarOtp:
          Type: Api
          Properties:
            Path: /api/auth/aadhaar/send-otp
            Method: post
            RestApiId: !Ref HappnixDevApi
        VerifyAadhaarOtp:
          Type: Api
          Properties:
            Path: /api/auth/aadhaar/verify-otp
            Method: post
            RestApiId: !Ref HappnixDevApi

  HappnixDevApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: happnix-dev-api
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Requested-With'"
        AllowOrigin: "'*'"

Outputs:
  HappnixApiUrl:
    Description: Invoke URL for the HappniX deployment skeleton API.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}"
  SignupSigninUrl:
    Description: Auth entry endpoint for the HappniX API.
    Value: !Sub "https://${HappnixDevApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/api/auth/mobile/send-otp"
  HappnixUserPoolId:
    Description: Cognito User Pool ID for HappniX authentication.
    Value: !Ref HappnixUserPool
  HappnixUserPoolClientId:
    Description: Cognito App Client ID for HappniX authentication.
    Value: !Ref HappnixUserPoolClient
  HappnixUserPoolArn:
    Description: Cognito User Pool ARN for HappniX authentication.
    Value: !GetAtt HappnixUserPool.Arn
  HappnixCognitoRegion:
    Description: Cognito region for HappniX authentication.
    Value: !Ref AWS::Region
  HappnixDatabaseEndpoint:
    Description: PostgreSQL endpoint for HappniX backend.
    Value: !GetAtt HappnixPostgresDatabase.Endpoint.Address
  HappnixDatabasePort:
    Description: PostgreSQL port for HappniX backend.
    Value: !GetAtt HappnixPostgresDatabase.Endpoint.Port
